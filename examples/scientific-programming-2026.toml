# One course, one cohort.
#
# Everything not named here comes from defaults.toml. To set up next year,
# copy this file and change the cohort.

course = "scientific-programming"
cohort = 2026

# When the state of each repository is recorded. Give the offset from UTC, so
# that a deadline does not move when the clocks change.
[[deadlines]]
task     = "design"
deadline = "2026-10-30T23:59:00+01:00"

[[deadlines]]
task     = "final"
deadline = "2026-12-11T23:59:00+01:00"
